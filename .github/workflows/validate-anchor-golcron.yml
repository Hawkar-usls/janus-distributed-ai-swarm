name: Validate Anchor and Golcron

on:
  pull_request:
    paths:
      - 'firmware/anchor/**'
      - 'firmware/golcron/**'
      - '.github/workflows/validate-anchor-golcron.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public source contains placeholders only
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --exclude='README.md' -E 'Toy Castle|Alkarnet' firmware/anchor firmware/golcron
          grep -RIn 'YOUR_WIFI' firmware/anchor/Anchor.ino
          grep -RIn 'YOUR_PASS' firmware/anchor/Anchor.ino

      - name: Install Arduino CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Install Espressif ESP32 core
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core list

      - name: Prepare Arduino sketch folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/Anchor /tmp/Golcron
          cp firmware/anchor/*.ino /tmp/Anchor/
          cp firmware/golcron/*.ino /tmp/Golcron/
          test -f /tmp/Anchor/Anchor.ino
          test -f /tmp/Golcron/Golcron.ino
          echo 'Anchor tabs:'
          find /tmp/Anchor -maxdepth 1 -name '*.ino' -printf '%f\n' | sort
          echo 'Golcron tabs:'
          find /tmp/Golcron -maxdepth 1 -name '*.ino' -printf '%f\n' | sort

      - name: Compile Anchor v1.20 for ESP32-S3
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile --warnings all --fqbn esp32:esp32:esp32s3 /tmp/Anchor

      - name: Compile Golcron v1.5 for classic ESP32
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile --warnings all --fqbn esp32:esp32:esp32 /tmp/Golcron
