name: validate-adv-elite-rc2

on:
  push:
    paths:
      - 'firmware/adv_elite/**'
      - '.github/workflows/validate-adv-elite-rc1.yml'
  pull_request:
    paths:
      - 'firmware/adv_elite/**'
      - '.github/workflows/validate-adv-elite-rc1.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned M5Cardputer ADV keyboard layer
        uses: actions/checkout@v4
        with:
          repository: m5stack/M5Cardputer
          ref: f1392858b9994c3547120e602a57d3553d16ab01
          path: _vendor/M5Cardputer

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install M5Stack core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32

      - name: Resolve actual Cardputer ADV FQBN
        shell: bash
        run: |
          arduino-cli board listall > /tmp/m5_boards.txt
          cat /tmp/m5_boards.txt | grep -i -E 'cardputer|adv' || true
          ADV_FQBN="$(awk 'BEGIN{IGNORECASE=1} /Cardputer/ && /ADV/ {print $NF; exit}' /tmp/m5_boards.txt)"
          if [ -z "$ADV_FQBN" ]; then
            echo '::error::M5Stack core does not expose a Cardputer ADV board profile'
            exit 1
          fi
          echo "ADV_FQBN=$ADV_FQBN" | tee /tmp/adv_fqbn.txt
          echo "ADV_FQBN=$ADV_FQBN" >> "$GITHUB_ENV"

      - name: Install libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "M5Cardputer"
          arduino-cli lib install "FastLED"
          arduino-cli lib install "M5Unit-ENV"
          arduino-cli lib install "TinyGPSPlus"
          arduino-cli lib install "RadioLib"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "ESP8266Audio"

      - name: Normalize sketch name for case-sensitive runner
        run: |
          mv firmware/adv_elite/ADV_Elite.ino firmware/adv_elite/adv_elite.ino

      - name: Compile ADV Elite
        id: compile
        shell: bash
        run: |
          set +e
          rm -rf /tmp/adv_build
          mkdir -p /tmp/adv_build
          echo "Compiling for $ADV_FQBN"
          arduino-cli compile \
            --fqbn "$ADV_FQBN" \
            --build-property "upload.maximum_size=3342336" \
            --warnings all \
            --library _vendor/M5Cardputer \
            --output-dir /tmp/adv_build \
            firmware/adv_elite 2>&1 | tee /tmp/adv_compile.log
          status=${PIPESTATUS[0]}
          echo "$status" > /tmp/adv_compile.status
          if [ "$status" -ne 0 ]; then
            grep -E 'fatal error:|error:|not declared|no member named|cannot convert|undefined reference|exit status|Compilation failed|Sketch too big|text section exceeds' /tmp/adv_compile.log \
              | tail -n 100 \
              | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit 0

      - name: Upload compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adv-elite-compile-diagnostics
          path: |
            /tmp/adv_compile.log
            /tmp/adv_compile.status
            /tmp/m5_boards.txt
            /tmp/adv_fqbn.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload compiled ADV binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adv-elite-compiled-bins
          path: /tmp/adv_build/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce compile result
        if: always()
        shell: bash
        run: |
          test -f /tmp/adv_compile.status
          test "$(cat /tmp/adv_compile.status)" = "0"
