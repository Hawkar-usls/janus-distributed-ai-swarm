name: Patch ADV keyboard compatibility once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-adv-keyboard-compat-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch ADV input router for old and new M5Cardputer APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('firmware/adv_elite/ADV_Elite.ino')
          s = p.read_text(encoding='utf-8')

          old1 = "  bool nEnter=ks.enter,nEsc=ks.esc,nSpace=ks.space,nL=keyNow('l','L'),nJ=keyNow('j','J'),nO=keyNow('o','O'),nZ=keyNow('z','Z'),nR=keyNow('r','R'),nD=keyNow('d','D'),nA=keyNow('a','A'),nG=keyNow('g','G'),nP=keyNow('p','P'),nI=keyNow('i','I'),nMinus=keyNow('-','_'),nPlus=keyNow('+','='),nLb=keyNow('[','{'),nRb=keyNow(']','}');"
          new1 = """  bool nEnter=ks.enter;
  bool nEsc=ks.fn && keyNow('`','~');
  bool nSpace=ks.space;
  bool nL=keyNow('l','L'),nJ=keyNow('j','J'),nO=keyNow('o','O'),nZ=keyNow('z','Z'),nR=keyNow('r','R'),nD=keyNow('d','D'),nA=keyNow('a','A'),nG=keyNow('g','G'),nP=keyNow('p','P'),nI=keyNow('i','I');
  bool nMinus=keyNow('-','_'),nPlus=keyNow('+','='),nLb=keyNow('[','{'),nRb=keyNow(']','}');"""

          old2 = "  bool left=ks.left||keyNow('a','A'),right=ks.right||keyNow('d','D'),up=ks.up||keyNow('w','W'),down=ks.down||keyNow('s','S');"
          new2 = """  // Compatible with both legacy and current M5Cardputer keyboard APIs.
  // Legacy library has no ks.left/right/up/down/esc fields; Fn-layer is decoded here.
  bool left=(ks.fn&&keyNow(',','<'))||keyNow('a','A');
  bool right=(ks.fn&&keyNow('/','?'))||keyNow('d','D');
  bool up=(ks.fn&&keyNow(';',':'))||keyNow('w','W');
  bool down=(ks.fn&&keyNow('.','>'))||keyNow('s','S');"""

          if old1 not in s:
              raise SystemExit('primary key declaration not found; refusing blind patch')
          if old2 not in s:
              raise SystemExit('direction declaration not found; refusing blind patch')

          s = s.replace(old1, new1, 1)
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit compatibility patch
        run: |
          git config user.name "JANUS Builder"
          git config user.email "actions@users.noreply.github.com"
          git add firmware/adv_elite/ADV_Elite.ino
          git commit -m "fix(adv): support legacy and current M5Cardputer keyboard APIs"
          git push
