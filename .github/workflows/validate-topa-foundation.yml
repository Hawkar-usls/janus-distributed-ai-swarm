name: Validate TOPA Runtime Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - '.janus/TOPA_FOUNDATION.json'
      - 'tools/topa_epistemic_router.py'
      - 'tools/kenshi_swarm_runtime.py'
      - 'tests/test_topa_epistemic_router.py'
      - '.github/workflows/validate-topa-foundation.yml'
  push:
    branches: [main]
    paths:
      - '.janus/TOPA_FOUNDATION.json'
      - 'tools/topa_epistemic_router.py'
      - 'tools/kenshi_swarm_runtime.py'
      - 'tests/test_topa_epistemic_router.py'
      - '.github/workflows/validate-topa-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate TOPA v1.2 binding
        run: |
          python - <<'PY'
          import json
          p=json.load(open('.janus/TOPA_FOUNDATION.json'))
          assert p['schema']=='janus.distributed_swarm.topa_foundation_binding.v1.2'
          assert p['version']=='1.2'
          assert p['canonical_foundation']['version']=='1.2'
          assert p['case_corpus_lineage']['path']=='data/JANUS-TOPA-ART-BELL-REAL-CALLER-ARCHIVE-v1.2.json'
          assert p['case_corpus_lineage']['caller_records_at_adoption']==136
          assert p['observer_pattern']['source_is_fiction'] is True
          assert p['observer_pattern']['empirical_authority'] is False
          assert p['kenshi_binding']['rule']=='SYNC_STATE_NOT_IDENTITY'
          assert p['kenshi_binding']['provenance_may_be_erased_during_handoff'] is False
          gate=p['runtime_gate']
          assert gate['positive_status_requires_provenance_channel'] is True
          assert gate['positive_status_requires_firsthand_status'] is True
          assert gate['hearsay_may_be_promoted_to_direct_observation'] is False
          assert gate['institutional_role_counts_as_truth'] is False
          assert gate['self_identification_authenticates_source'] is False
          assert gate['raw_ledger_may_be_rewritten_by_model'] is False
          assert gate['prediction_must_be_frozen_before_scoring'] is True
          assert gate['post_hoc_prediction_redefinition_allowed'] is False
          assert gate['failed_prediction_may_lower_confidence'] is True
          print('JANUS_TOPA_RUNTIME_BINDING_V1_2=PASS')
          PY
      - name: Run TOPA router self-test
        run: python tools/topa_epistemic_router.py
      - name: Run Kenshi plus TOPA composite self-test
        run: python tools/kenshi_swarm_runtime.py
      - name: Run TOPA unit tests
        run: python -m unittest tests/test_topa_epistemic_router.py
      - name: Compile runtime modules
        run: python -m py_compile tools/topa_epistemic_router.py tools/kenshi_swarm_runtime.py
