name: Validate TOPA Runtime Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - '.janus/TOPA_FOUNDATION.json'
      - 'tools/topa_epistemic_router.py'
      - 'tools/kenshi_swarm_runtime.py'
      - 'tests/test_topa_epistemic_router.py'
      - '.github/workflows/validate-topa-foundation.yml'
  push:
    branches: [main]
    paths:
      - '.janus/TOPA_FOUNDATION.json'
      - 'tools/topa_epistemic_router.py'
      - 'tools/kenshi_swarm_runtime.py'
      - 'tests/test_topa_epistemic_router.py'
      - '.github/workflows/validate-topa-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate TOPA v1.1 binding
        run: |
          python - <<'PY'
          import json
          p=json.load(open('.janus/TOPA_FOUNDATION.json'))
          assert p['schema']=='janus.distributed_swarm.topa_foundation_binding.v1.1'
          assert p['version']=='1.1'
          assert p['status']=='ACTIVE_RUNTIME_EPISTEMIC_FOUNDATION'
          assert p['canonical_foundation']['repository']=='Hawkar-usls/Janus_Genesis'
          assert p['canonical_foundation']['version']=='1.1'
          assert p['kenshi_binding']['rule']=='SYNC_STATE_NOT_IDENTITY'
          assert p['case_corpus_lineage']['path']=='data/JANUS-TOPA-ART-BELL-REAL-CALLER-ARCHIVE-v1.0.json'
          gate=p['runtime_gate']
          assert gate['unresolved_allowed'] is True
          assert gate['same_source_multi_agent_counts_as_independent_replication'] is False
          assert gate['missing_data_may_be_imputed_as_evidence'] is False
          assert gate['audience_size_counts_as_corroboration'] is False
          assert gate['repetition_counts_as_independence'] is False
          assert gate['failed_test_may_lower_confidence'] is True
          assert gate['mundane_first_required'] is True
          assert gate['closed_belief_loop_warning_required'] is True
          print('JANUS_TOPA_RUNTIME_BINDING_V1_1=PASS')
          PY
      - name: Run TOPA router self-test
        run: python tools/topa_epistemic_router.py
      - name: Run Kenshi plus TOPA composite self-test
        run: python tools/kenshi_swarm_runtime.py
      - name: Run TOPA unit tests
        run: python -m unittest tests/test_topa_epistemic_router.py
