name: Validate TOPA Strict Science Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '.janus/TOPA_FOUNDATION.json'
      - 'tools/topa_epistemic_router.py'
      - 'tools/kenshi_swarm_runtime.py'
      - 'tests/test_topa_epistemic_router.py'
      - '.github/workflows/validate-topa-foundation.yml'
  push:
    branches: [main]
    paths:
      - '.janus/TOPA_FOUNDATION.json'
      - 'tools/topa_epistemic_router.py'
      - 'tools/kenshi_swarm_runtime.py'
      - 'tests/test_topa_epistemic_router.py'
      - '.github/workflows/validate-topa-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate TOPA v1.3 strict science binding
        run: |
          python - <<'PY'
          import json
          p=json.load(open('.janus/TOPA_FOUNDATION.json'))
          assert p['schema']=='janus.distributed_swarm.topa_foundation_binding.v1.3'
          assert p['version']=='1.3'
          cf=p['canonical_foundation']
          assert cf['repository']=='Hawkar-usls/TOPA'
          assert cf['path']=='protocols/TOPA_FOUNDATION.json'
          assert cf['version']=='1.3'
          sg=p['strict_science_gate']
          assert sg['repository']=='Hawkar-usls/TOPA'
          assert sg['heuristic_authority'] is False
          gate=p['runtime_gate']
          assert gate['evidence_class_required'] is True
          assert gate['uncalibrated_confidence_allowed'] is False
          assert gate['heuristic_score_allowed_as_evidence'] is False
          assert gate['survivor_label_allowed_as_evidence'] is False
          assert gate['hypothesis_may_be_promoted_as_fact'] is False
          assert gate['statistical_status_requires_model'] is True
          assert gate['independent_replication_requires_dependency_analysis'] is True
          assert gate['prediction_must_be_frozen_before_scoring'] is True
          assert gate['post_hoc_prediction_redefinition_allowed'] is False
          print('JANUS_TOPA_RUNTIME_BINDING_V1_3_STRICT_SCIENCE=PASS')
          PY

      - name: Run TOPA strict-science router self-test
        run: python tools/topa_epistemic_router.py

      - name: Run Kenshi plus TOPA strict-science composite self-test
        run: python tools/kenshi_swarm_runtime.py

      - name: Run TOPA strict-science unit tests
        run: python -m unittest tests/test_topa_epistemic_router.py

      - name: Compile runtime modules
        run: python -m py_compile tools/topa_epistemic_router.py tools/kenshi_swarm_runtime.py
